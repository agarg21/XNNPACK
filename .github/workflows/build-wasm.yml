name: Build WebAssembly

on:
  pull_request:
  push:
    branches: [measure/fix-ccache]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmake-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: emscripten/emsdk:6.0.6@sha256:be96eff5810e42c632f3f8b795388a6b596e4fb21ec28b9e1fb1bc49bb3b1eef
    env:
      EM_COMPILER_WRAPPER: ccache
      CCACHE_DIR: /root/.ccache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install ccache
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ccache && ccache --version | head -1
      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: /root/.ccache
          key: ccache-wasm-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-wasm-
      - name: Configure ccache limit
        run: |
          ccache -M 500M
          ccache -z
      - name: Configure and build
        run: bash scripts/build-wasm.sh
      - name: Print ccache stats
        run: ccache -s
      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: /root/.ccache
          key: ccache-wasm-${{ github.run_id }}-${{ github.run_attempt }}
